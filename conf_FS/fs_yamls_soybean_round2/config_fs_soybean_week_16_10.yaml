      - 0.079
      - 6099.627
      - 6499.918
      - 44.726
      - 4.492
      - 15.991
      - 28.075
      - 41.569
    task: regression
    test_data_root:
      DEM: processed_data_fs_16_10/DEM
      S1GRD: processed_data_fs_16_10/S1GRD
      S2L2A: processed_data_fs_16_10/S2L2A
      SOIL: processed_data_fs_16_10/SOIL
    test_label_data_root: processed_data_fs_16_10/yield_geotiffs
    test_split: processed_data_fs_16_10/test_soybean.txt
    train_data_root:
      DEM: processed_data_fs_16_10/DEM
      S1GRD: processed_data_fs_16_10/S1GRD
      S2L2A: processed_data_fs_16_10/S2L2A
      SOIL: processed_data_fs_16_10/SOIL
    train_label_data_root: processed_data_fs_16_10/yield_geotiffs
    train_split: processed_data_fs_16_10/train_soybean.txt
    val_data_root:
      DEM: processed_data_fs_16_10/DEM
      S1GRD: processed_data_fs_16_10/S1GRD
      S2L2A: processed_data_fs_16_10/S2L2A
      SOIL: processed_data_fs_16_10/SOIL
    val_label_data_root: processed_data_fs_16_10/yield_geotiffs
    val_split: processed_data_fs_16_10/val_soybean.txt
lr_scheduler:
  class_path: ReduceLROnPlateau
  init_args:
    factor: 0.8
    min_lr: 1.0e-06
    monitor: val/loss
    patience: 25
model:
  class_path: terratorch.tasks.PixelwiseRegressionTask
  init_args:
    freeze_backbone: false
    freeze_decoder: false
    ignore_index: -1
    loss: mse
    model_args:
      backbone: terramind_v1_base
      backbone_merge_method: mean
      backbone_modalities:
      - S2L2A
      - S1GRD
      - SOIL: 10
      - DEM
      backbone_pretrained: true
      decoder: UNetDecoder
      decoder_channels:
      - 512
      - 256
      - 128
      - 64
      head_dropout: 0.1
      necks:
      - indices:
        - 2
        - 5
        - 8
        - 11
        name: SelectIndices
      - name: ReshapeTokensToImage
        remove_cls_token: false
      - name: LearnedInterpolateToPyramidal
    model_factory: EncoderDecoderFactory
optimizer:
  class_path: torch.optim.AdamW
  init_args:
    lr: 1e-4
seed_everything: 42
trainer:
  accelerator: auto
  accumulate_grad_batches: 8
  callbacks:
  - class_path: ModelCheckpoint
    init_args:
      dirpath: output/soybean/FS_S12SD/week_16_10/checkpoints
      filename: best-{epoch:03d}
      mode: min
      monitor: val/loss
      save_last: true
      save_top_k: 1
  - class_path: EarlyStopping
    init_args:
      min_delta: 0.0001
      mode: min
      monitor: val/loss
      patience: 75
      verbose: true
  - class_path: LearningRateMonitor
    init_args:
      logging_interval: epoch
  - class_path: RichProgressBar
  devices: auto
  log_every_n_steps: 1
  logger:
  - class_path: WandbLogger
    init_args:
      name: FS_Soybean_S12SD_week_16_10
      project: M4_Soybean
  max_epochs: 1000
  num_nodes: 1
  precision: 16-mixed
  strategy: auto
