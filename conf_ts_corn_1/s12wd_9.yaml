# lightning.pytorch==2.1.1
seed_everything: 42
trainer:
  accelerator: auto
  strategy: auto
  devices: auto
  num_nodes: 1
  precision: 16-mixed
  logger:
    - class_path: WandbLogger
      init_args:
        project: regr_corn_1
        name: S12wd_9         # <-- updated for biweek 9
        id: S12wd_9           # <-- updated for biweek 9
  callbacks:
    - class_path: EarlyStopping
      init_args:
          monitor: val/loss 
          patience: 75
          min_delta: 0.0001
          mode: min
          verbose: true
    - class_path: RichProgressBar
    - class_path: LearningRateMonitor
      init_args:
        logging_interval: epoch
  max_epochs: 1000
  log_every_n_steps: 1
  accumulate_grad_batches: 8
  default_root_dir: output/S12wd_9   # <-- updated for biweek 9

data:
  class_path: terratorch.datamodules.GenericMultiModalDataModule
  init_args:
    task: 'regression'
    batch_size: 4
    num_workers: 8
    modalities:
