# lightning.pytorch==2.1.1
seed_everything: 42
trainer:
  accelerator: auto
  strategy: auto
  devices: auto
  num_nodes: 1
  precision: 16-mixed
  logger:
    - class_path: WandbLogger
      init_args:
        project: regr_corn
        name: S12wds_24         
        id: S12wds_24           
  callbacks:
    - class_path: EarlyStopping
      init_args:
          monitor: val/loss 
          patience: 75
          min_delta: 0.0001
          mode: min
          verbose: true
    - class_path: RichProgressBar
    - class_path: LearningRateMonitor
      init_args:
        logging_interval: epoch
  max_epochs: 1000
  log_every_n_steps: 1
  accumulate_grad_batches: 8
  default_root_dir: output/S12wds_24   # <-- 수정

data:
  class_path: terratorch.datamodules.GenericMultiModalDataModule
  init_args:
    task: 'regression'
    batch_size: 4
    num_workers: 8
    modalities:
      - S2L2A
      - S1RTC
      - DEM
      - WEATHER
      - SOIL          # <-- add!
      
    rgb_modality: S2L2A
    rgb_indices:
      - 3
      - 2
      - 1
    train_data_root:
      S2L2A: processed_data_weekly_24/S2L2A       
      S1RTC: processed_data_weekly_24/S1RTC       
      DEM: processed_data_weekly_24/DEM           
      WEATHER: processed_data_weekly_24/WEATHER   
      SOIL: processed_data_weekly_24/SOIL         # <-- add!
    train_label_data_root: processed_data_weekly_24/yield_geotiffs   

    val_data_root:
      S2L2A: processed_data_weekly_24/S2L2A
      S1RTC: processed_data_weekly_24/S1RTC
      DEM: processed_data_weekly_24/DEM
      WEATHER: processed_data_weekly_24/WEATHER
      SOIL: processed_data_weekly_24/SOIL         # <-- add!
    val_label_data_root: processed_data_weekly_24/yield_geotiffs

    test_data_root:
      S2L2A: processed_data_weekly_24/S2L2A
      S1RTC: processed_data_weekly_24/S1RTC
      DEM: processed_data_weekly_24/DEM
      WEATHER: processed_data_weekly_24/WEATHER
      SOIL: processed_data_weekly_24/SOIL         # <-- add!
    test_label_data_root: processed_data_weekly_24/yield_geotiffs

    train_split: processed_data_weekly_24/train_corn.txt  
    val_split: processed_data_weekly_24/val_corn.txt      
    test_split: processed_data_weekly_24/test_corn.txt   

    expand_temporal_dimension: False
    no_label_replace: 0.0
    no_data_replace: 0
    
    # TerraMind standardization values
    means:
      S2L2A: [1390.458, 1503.317, 1718.197, 1853.910, 2199.100, 2779.975, 2987.011, 3083.234, 3132.220, 3162.988, 2424.884, 1857.648]
      S1RTC: [-10.930, -17.329]
      DEM: [670.665]
      WEATHER: [23.852, 24.604, 12.061, 373.483, 1482.228, 0.546, 49958.0]
      SOIL: [0.812, 0.787, 0.741, 20105.457, 21385.010, 253.446, 87.677, 182.113, 264.614, 335.111]

    stds:
      S2L2A: [2106.761, 2141.107, 2038.973, 2134.138, 2085.321, 1889.926, 1820.257, 1871.918, 1753.829, 1797.379, 1434.261, 1334.311]
      S1RTC: [4.391, 4.459]
      DEM: [951.272]
      WEATHER: [8.048, 1.233, 1.242, 11.315, 120.636, 1.336, 509.966]
      SOIL: [0.064, 0.071, 0.078, 6069.204, 6464.559, 44.624, 4.491, 15.901, 27.982, 41.473]

model:
  class_path: terratorch.tasks.PixelwiseRegressionTask
  init_args:
    model_factory: EncoderDecoderFactory
    model_args:
      backbone: terramind_v1_base
      backbone_pretrained: true
      backbone_modalities:
        - S2L2A
        - S1RTC
        - DEM
        - {"WEATHER": 7}
        - {"SOIL": 10}      # <-- add! (10 channels)
      backbone_merge_method: mean

      necks:
        - name: SelectIndices
          indices: [2, 5, 8, 11]
        - name: ReshapeTokensToImage
          remove_cls_token: False
        - name: LearnedInterpolateToPyramidal

      decoder: UNetDecoder
      decoder_channels: [512, 256, 128, 64]

      head_dropout: 0.1
    loss: mse
    ignore_index: -1
    freeze_backbone: false
    freeze_decoder: false

optimizer:
  class_path: torch.optim.AdamW
  init_args:
    lr: 1.e-4
lr_scheduler:
  class_path: ReduceLROnPlateau
  init_args:
    monitor: val/loss
    factor: 0.8
    patience: 25
    min_lr: 0.000001