      DEM: [670.665]
      MODIS: [854.473, 3450.634, 455.066, 826.045, 3500.701, 2749.189, 1646.328]
      SOIL: [164.401, 233.710, 280.134, 0.668, 0.648, 230.887, 13863.224, 14870.775, 87.595, 0.566]
      WEATHER: [49565.363, 3.569, 372.732, 0.220, 25.605, 13.400, 1624.082]
